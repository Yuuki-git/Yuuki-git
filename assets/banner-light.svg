<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="Yuuki-git profile banner (light)">
  <defs>
    <linearGradient id="bg-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f3f6fb"/>
    </linearGradient>
    <radialGradient id="glow-blue-l" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#8250df" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green-l" cx="15%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#1a7f37" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
    <pattern id="dot-grid-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#d0d7de" opacity="0.7"/>
    </pattern>
    <clipPath id="card-clip-l">
      <rect x="1" y="1" width="878" height="228" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-l)">
    <rect x="0" y="0" width="880" height="230" fill="url(#bg-grad-l)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#dot-grid-l)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#glow-blue-l)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#glow-green-l)"/>
    <rect x="1" y="1" width="878" height="2.5" fill="url(#accent-line-l)" opacity="0.9"/>
  </g>
  <rect x="1" y="1" width="878" height="228" rx="16" fill="none" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Left: Identity & Track -->
  <g>
    <!-- Status Pill -->
    <rect x="36" y="28" width="258" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="52" cy="40" r="3.5" fill="#1a7f37">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="44" fill="#57606a" font-family="'Consolas','SFMono-Regular','Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="0.4">MULTIMODAL AI · BACKEND SYSTEMS</text>

    <!-- Display Name + Handle -->
    <text x="36" y="96" fill="#1f2328" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">Yuuki<tspan fill="#0969da" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="16" font-weight="500" dx="12">@Yuuki-git</tspan></text>

    <!-- Affiliation & Positioning -->
    <text x="36" y="130" fill="#24292f" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">M.S. Student @ Zhengzhou University (ZZU)</text>
    <text x="36" y="156" fill="#57606a" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13.5">Multimodal Learning Research · Java / Python Backend Engineer</text>

    <!-- Focus Chips -->
    <rect x="36" y="178" width="114" height="26" rx="7" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
    <text x="93" y="195" text-anchor="middle" fill="#0969da" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Multimodal AI</text>

    <rect x="158" y="178" width="132" height="26" rx="7" fill="#dafbe1" stroke="#4ac26b" stroke-width="1"/>
    <text x="224" y="195" text-anchor="middle" fill="#1a7f37" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Spring Boot · RAG</text>

    <rect x="298" y="178" width="132" height="26" rx="7" fill="#fbefff" stroke="#c297ff" stroke-width="1"/>
    <text x="364" y="195" text-anchor="middle" fill="#8250df" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Agents · AI Infra</text>
  </g>

  <!-- Right: Mini Terminal Card -->
  <g>
    <rect x="488" y="26" width="356" height="178" rx="12" fill="#ffffff" fill-opacity="0.96" stroke="#d0d7de" stroke-width="1.1"/>
    <path d="M 488 38 A 12 12 0 0 1 500 26 L 832 26 A 12 12 0 0 1 844 38 L 844 56 L 488 56 Z" fill="#f6f8fa"/>
    <line x1="488" y1="56" x2="844" y2="56" stroke="#d0d7de" stroke-width="1"/>

    <circle cx="508" cy="41" r="4.5" fill="#ff5f56"/>
    <circle cx="523" cy="41" r="4.5" fill="#ffbd2e"/>
    <circle cx="538" cy="41" r="4.5" fill="#27c93f"/>
    <text x="556" y="45" fill="#57606a" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="11.5">yuuki@zzu — profile.yaml</text>

    <text x="506" y="83" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#0969da">affiliation</tspan><tspan fill="#57606a"> : </tspan><tspan fill="#1f2328">Zhengzhou University (ZZU)</tspan>
    </text>
    <text x="506" y="107" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#0969da">research</tspan><tspan fill="#57606a">    : </tspan><tspan fill="#1f2328">Multimodal AI · Video Gen</tspan>
    </text>
    <text x="506" y="131" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#0969da">backend</tspan><tspan fill="#57606a">     : </tspan><tspan fill="#1f2328">Java · Python · Distributed</tspan>
    </text>
    <text x="506" y="155" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#0969da">focus</tspan><tspan fill="#57606a">       : </tspan><tspan fill="#1f2328">Hybrid RAG · Agents · Kernel</tspan>
    </text>
    <text x="506" y="182" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#1a7f37">$</tspan><tspan fill="#57606a"> </tspan><tspan fill="#0550ae">status --now</tspan><tspan fill="#57606a"> → </tspan><tspan fill="#8250df">shipping &amp; exploring</tspan>
    </text>
    <rect x="761" y="171" width="7" height="13" rx="1.5" fill="#0969da">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
