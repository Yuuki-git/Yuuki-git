<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="Yuuki-git profile banner (dark)">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1520"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="15%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="878" height="228" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="880" height="230" fill="url(#bg-grad)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#dot-grid)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#glow-blue)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#glow-green)"/>
    <rect x="1" y="1" width="878" height="2.5" fill="url(#accent-line)" opacity="0.9"/>
  </g>
  <rect x="1" y="1" width="878" height="228" rx="16" fill="none" stroke="#30363d" stroke-width="1.2"/>

  <!-- Left: Identity & Track -->
  <g>
    <!-- Status Pill -->
    <rect x="36" y="28" width="258" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="52" cy="40" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="44" fill="#8b949e" font-family="'Consolas','SFMono-Regular','Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="0.4">MULTIMODAL AI · BACKEND SYSTEMS</text>

    <!-- Display Name + Handle -->
    <text x="36" y="96" fill="#f0f6fc" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">Yuuki<tspan fill="#58a6ff" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="16" font-weight="500" dx="12">@Yuuki-git</tspan></text>

    <!-- Affiliation & Positioning -->
    <text x="36" y="130" fill="#c9d1d9" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">M.S. Student @ Zhengzhou University (ZZU)</text>
    <text x="36" y="156" fill="#8b949e" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13.5">Multimodal Learning Research · Java / Python Backend Engineer</text>

    <!-- Focus Chips -->
    <rect x="36" y="178" width="114" height="26" rx="7" fill="#162235" stroke="#264f78" stroke-width="1"/>
    <text x="93" y="195" text-anchor="middle" fill="#79c0ff" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Multimodal AI</text>

    <rect x="158" y="178" width="132" height="26" rx="7" fill="#17251e" stroke="#235733" stroke-width="1"/>
    <text x="224" y="195" text-anchor="middle" fill="#56d364" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Spring Boot · RAG</text>

    <rect x="298" y="178" width="132" height="26" rx="7" fill="#231c35" stroke="#483775" stroke-width="1"/>
    <text x="364" y="195" text-anchor="middle" fill="#d2a8ff" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Agents · AI Infra</text>
  </g>

  <!-- Right: Mini Terminal Card -->
  <g>
    <rect x="488" y="26" width="356" height="178" rx="12" fill="#0d1117" fill-opacity="0.92" stroke="#30363d" stroke-width="1.1"/>
    <path d="M 488 38 A 12 12 0 0 1 500 26 L 832 26 A 12 12 0 0 1 844 38 L 844 56 L 488 56 Z" fill="#161b22"/>
    <line x1="488" y1="56" x2="844" y2="56" stroke="#30363d" stroke-width="1"/>

    <circle cx="508" cy="41" r="4.5" fill="#ff5f56"/>
    <circle cx="523" cy="41" r="4.5" fill="#ffbd2e"/>
    <circle cx="538" cy="41" r="4.5" fill="#27c93f"/>
    <text x="556" y="45" fill="#8b949e" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="11.5">yuuki@zzu — profile.yaml</text>

    <text x="506" y="83" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#79c0ff">affiliation</tspan><tspan fill="#8b949e"> : </tspan><tspan fill="#e6edf3">Zhengzhou University (ZZU)</tspan>
    </text>
    <text x="506" y="107" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#79c0ff">research</tspan><tspan fill="#8b949e">    : </tspan><tspan fill="#e6edf3">Multimodal AI · Video Gen</tspan>
    </text>
    <text x="506" y="131" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#79c0ff">backend</tspan><tspan fill="#8b949e">     : </tspan><tspan fill="#e6edf3">Java · Python · Distributed</tspan>
    </text>
    <text x="506" y="155" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#79c0ff">focus</tspan><tspan fill="#8b949e">       : </tspan><tspan fill="#e6edf3">Hybrid RAG · Agents · Kernel</tspan>
    </text>
    <text x="506" y="182" font-family="'Consolas','SFMono-Regular',Menlo,monospace" font-size="12">
      <tspan fill="#3fb950">$</tspan><tspan fill="#8b949e"> </tspan><tspan fill="#a5d6ff">status --now</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#d2a8ff">shipping &amp; exploring</tspan>
    </text>
    <rect x="761" y="171" width="7" height="13" rx="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
